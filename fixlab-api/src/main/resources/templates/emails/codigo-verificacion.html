<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ASUNTO}}</title>
</head>
<body style="margin:0; padding:0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color:#f4f4f4;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color:#f4f4f4;">
        <tr>
            <td align="center" style="padding: 40px 20px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" style="max-width:600px; background-color:#ffffff; border-radius:8px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
                    <!-- Header oscuro con logo -->
                    <tr>
                        <td style="background-color:#0f172a; padding: 24px 32px;">
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                                <tr>
                                    <td style="padding-right:12px; vertical-align:middle;">{{LOGO_IMG}}</td>
                                    <td style="vertical-align:middle;"><span style="font-size:24px; font-weight:700; color:#ffffff; letter-spacing:-0.5px;">FixLab</span></td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <!-- Línea azul separadora -->
                    <tr>
                        <td style="height:4px; background-color:#3b82f6;"></td>
                    </tr>
                    <!-- Hero section azul -->
                    <tr>
                        <td style="background-color:#1e40af; padding: 32px 32px;">
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                                <tr>
                                    <td>
                                        <div style="font-size:14px; color:#ffffff; font-weight:400; margin-bottom:4px;">{{TITULO}}</div>
                                        <div style="font-size:22px; color:#ffffff; font-weight:700; line-height:1.3;">{{SUBTITULO}}</div>
                                    </td>
                                    <td align="right" width="60">
                                        <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="right">
                                            <tr><td style="width:48px; height:48px; background-color:#ffffff; border-radius:50%; text-align:center; font-size:24px; color:#2563eb; font-weight:bold;">✓</td></tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <!-- Cuerpo del mensaje -->
                    <tr>
                        <td style="padding: 32px; background-color:#ffffff;">
                            <p style="margin:0 0 24px 0; font-size:15px; color:#1f2937; line-height:1.6;">
                                Hola <strong>{{NOMBRE}}</strong>,
                            </p>
                            <p style="margin:0 0 24px 0; font-size:15px; color:#1f2937; line-height:1.6;">
                                {{MENSAJE}}
                            </p>
                            <!-- Código destacado -->
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:24px 0;">
                                <tr>
                                    <td style="background-color:#eff6ff; padding: 20px 32px; border-radius:8px; text-align:center;">
                                        <span style="font-size:28px; font-weight:700; color:#1e40af; letter-spacing:8px;">{{CODIGO}}</span>
                                    </td>
                                </tr>
                            </table>
                            <p style="margin:0; font-size:14px; color:#6b7280; line-height:1.6;">
                                Este código expira en 15 minutos.
                            </p>
                            <p style="margin:16px 0 0 0; font-size:13px; color:#9ca3af;">
                                Si no solicitaste esta acción, ignora este mensaje y revisa la seguridad de tu cuenta.
                            </p>
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td style="padding: 24px 32px; background-color:#ffffff; border-top:1px solid #e5e7eb;">
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                                <tr>
                                    <td width="50" valign="top" style="padding-right:16px;">
                                        <span style="font-size:32px;">📱</span>
                                    </td>
                                    <td>
                                        <p style="margin:0; font-size:14px; color:#4b5563; line-height:1.6;">
                                            <strong>FixLab</strong>, tu tienda de tecnología de confianza.
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
