# ========== GEMINI (chat asistente) ==========
# Clave Google AI Studio. Puedes:
#   \u2022 Sustituir toda la l\u00EDnea por: gemini.api-key=TU_CLAVE (tu application.properties est\u00E1 en .gitignore)
#   \u2022 O dejar ${GEMINI_API_KEY:} y definir solo la variable de entorno al arrancar.
# Clave en esta l\u00EDnea o solo GEMINI_API_KEY; nunca subas la clave real si el archivo no est\u00E1 ignorado por Git.
gemini.api-key=${GEMINI_API_KEY:}
# Modelo estable seg\u00FAn doc. Google (1.5/2.0 deprecados o no disponibles en v1beta). Alternativas: gemini-2.5-flash, gemini-flash-latest
gemini.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
gemini.max-history-messages=24

# ========== OLLAMA (chat asistente local) ==========
# Ollama corre localmente en la m\u00E1quina donde se ejecuta el backend.
# Para demos por t\u00FAnel (ngrok/cloudflare), exp\u00F3n solo el backend; no expongas Ollama.
# Demo: URL p\u00FAblica del t\u00FAnel hacia Ollama en tu PC. Si ngrok cambia el dominio, actualiza esta l\u00EDnea.
ollama.base-url=https://overproficient-karin-unrefrigerated.ngrok-free.dev
ollama.model=${OLLAMA_MODEL:phi3}
ollama.max-history-messages=${OLLAMA_MAX_HISTORY_MESSAGES:10}
ollama.num-ctx=${OLLAMA_NUM_CTX:1024}
# M\u00E1s bajo = m\u00E1s r\u00E1pido pero puede cortar frases. M\u00E1s alto = m\u00E1s completo pero m\u00E1s lento/RAM.
ollama.num-predict=${OLLAMA_NUM_PREDICT:240}
# Si expones Ollama v\u00EDa ngrok free (*.ngrok-free.app / *.ngrok-free.dev), activa esto para evitar el interstitial HTML/403.
ollama.ngrok-skip-browser-warning=${OLLAMA_NGROK_SKIP_BROWSER_WARNING:true}

# ========== Postventa (PQRS / garant\u00EDas) ==========
# Meses de garant\u00EDa por venta de producto (pol\u00EDtica FixLab; ajustar seg\u00FAn t\u00E9rminos comerciales).
fixlab.pqrs.garantia-venta-meses=12

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB


