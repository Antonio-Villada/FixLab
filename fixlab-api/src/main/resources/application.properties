spring.application.name=fixlab
server.port=8081

# Configuración de la base de datos para FixLab
spring.datasource.url=jdbc:postgresql://localhost:5432/fixlab
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver


# Configuración de JPA / Hibernate para creación automática
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Opcional: para ver mejor las consultas en consola
spring.jpa.properties.hibernate.format_sql=true

