# CONFIGURACIÓN PRODUCCIÓN (spring.profiles.active=prod)
# ==========================================
# Activar con: java -jar app.jar --spring.profiles.active=prod
# O variable de entorno: SPRING_PROFILES_ACTIVE=prod

# Webhook de Wompi: URL pública donde Wompi envía notificaciones de pago.
# Debe ser accesible desde internet. Configurar también en el dashboard de Wompi.
wompi.webhook-url=http://34.75.187.247:8081/api/webhooks/wompi

# Enviar correos reales (recuperación de contraseña, verificación, etc.)
fixlab.mail.log-only=false

# URL del frontend para enlaces en correos (restablecer contraseña).
# Cambiar por la URL real donde esté desplegado el frontend.
# Ejemplos: https://tu-dominio.com, http://34.75.187.247 (si frontend en puerto 80)
fixlab.frontend.url=${FIXLAB_FRONTEND_URL:http://34.75.187.247}
