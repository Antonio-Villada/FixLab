# ==========================================
# CONFIGURACIÓN PRODUCCIÓN (spring.profiles.active=prod)
# ==========================================
# Arranque: SPRING_PROFILES_ACTIVE=prod  (o --spring.profiles.active=prod)
#
# Variables de entorno típicas en el servidor (Panel, Docker, systemd, etc.):
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#   JWT_SECRET (si lo externalizas)
#   GEMINI_API_KEY          -> OBLIGATORIA para el chat con IA (Google AI Studio, clave NUEVA; no commitear)
#   GEMINI_MODEL            -> opcional (por defecto gemini-2.5-flash-lite)
#   FIXLAB_FRONTEND_URL     -> URL pública del Angular (correos, enlaces)
#
# Ejemplo Linux:
#   export SPRING_PROFILES_ACTIVE=prod
#   export GEMINI_API_KEY="tu-clave-solo-en-el-servidor"
#   java -jar fixlab-api.jar

# Webhook de Wompi: URL pública del API (debe ser accesible desde internet).
wompi.webhook-url=https://api.villadastudios.com/api/webhooks/wompi

# Enviar correos reales (recuperación de contraseña, verificación, etc.)
fixlab.mail.log-only=false

# URL del frontend para enlaces en correos (restablecer contraseña).
fixlab.frontend.url=${FIXLAB_FRONTEND_URL:https://fixlab.villadastudios.com}

# Chat: la clave SOLO por entorno (nunca valor por defecto en el repo; Google invalida claves filtradas).
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
gemini.max-history-messages=${GEMINI_MAX_HISTORY_MESSAGES:24}
