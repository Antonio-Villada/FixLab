version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: fixlab-postgres
    restart: always
    environment:
      POSTGRES_DB: fixlab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - fixlab_data:/var/lib/postgresql/data

volumes:
  fixlab_data:
