name: FixLab CI/CD Pipeline

on:
  push:
    branches: [ main, ivan, cristian, antonio ]

jobs:
  # Fase 1: Integración Continua
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Compilar y probar Spring Boot
        working-directory: ./fixlab-api
        run: mvn clean package -DskipTests

  # Fase 2: Despliegue
  deploy-production:
    needs: build-and-test 
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' 
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Compilar para despliegue
        working-directory: ./fixlab-api
        run: mvn clean package -DskipTests
        
      - name: Preparar archivos (Staging)
        run: |
          mkdir -p deploy_folder
          cp fixlab-api/target/*.jar deploy_folder/
          cp fixlab-api/Dockerfile deploy_folder/
          cp docker-compose.yml deploy_folder/
          
      - uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "deploy_folder/*"
          target: "/home/${{ secrets.VM_USER }}"
          strip_components: 1
          
      - uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VM_USER }}
            sudo docker compose down
            sudo docker compose up --build -d