name: FixLab CI/CD Pipeline

on:
  push:
    branches: [ main, ivanbanol, cristiancastano, antoniovillada ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Compilar y probar Spring Boot
        working-directory: ./fixlab-api
        run: mvn clean package -DskipTests

  deploy-production:
    needs: build-and-test 
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' 
    steps:
      - uses: actions/checkout@v3
      
      - uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "fixlab-api/target/*.jar,fixlab-api/Dockerfile,docker-compose.yml"
          target: "/home/${{ secrets.VM_USER }}"
          strip_components: 1
          
      - uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VM_USER }}
            sudo docker compose down
            sudo docker compose up --build -d
