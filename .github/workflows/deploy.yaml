name: FixLab CI/CD Pipeline

on:
  push:
    branches: [ main, ivan, cristian, antonio ] # Pon el nombre exacto de tu rama aquí

jobs:
  # Fase 1: Integración Continua (Se ejecuta para TODOS)
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Compilar y probar Spring Boot
        run: mvn clean package
      
      # (Si Angular está en la misma build, agregarías los pasos de npm aquí)

  # Fase 2: Despliegue (SOLO se ejecuta si el push o merge es en main)
  deploy-production:
    needs: build-and-test # Espera a que el trabajo anterior sea exitoso
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Regla de oro: solo despliega main
    steps:
      - uses: actions/checkout@v3
      
      - uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "target/*.jar,Dockerfile,docker-compose.yml"
          target: "/home/${{ secrets.VM_USER }}"
          strip_components: 1
          
      - uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VM_USER }}
            sudo docker compose down
            sudo docker compose up --build -d