services:
  postgres:
    image: postgres:16
    container_name: fixlab-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432" # Permitir acceso a equipos de auditoría/producción
    volumes:
      - fixlab_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: fixlab-backend
    restart: always
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_AI_OLLAMA_BASE_URL=${OLLAMA_URL}
      - SPRING_AI_OLLAMA_CHAT_MODEL=${OLLAMA_MODEL}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=prometheus,health,info
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus:latest
    container_name: fixlab-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: fixlab-grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  fixlab_data:
  prometheus_data:
  grafana_data:
