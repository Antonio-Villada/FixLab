# Claves deben existir en SonarQube (o se crean en el primer análisis si está permitido).
# Token: variable de entorno SONAR_TOKEN (recomendado) o -Dsonar.token=...
sonar.projectKey=fixlab-web
sonar.projectName=FixLab Web

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/node_modules/**,**/dist/**,.angular/**

# 127.0.0.1 suele evitar ECONNRESET en Windows si "localhost" resuelve mal o hay proxy.
# Si usas proxy corporativo: NO_PROXY=localhost,127.0.0.1
sonar.host.url=http://127.0.0.1:9000
