<div class="container py-5 d-flex justify-content-center">
  <div class="card shadow border-0" style="max-width: 450px; width: 100%;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-person-plus text-primary fs-1"></i>
        <h2 class="fw-bold">Únete a FixLab</h2>
        <p class="text-muted small">Regístrate como cliente para gestionar tus reparaciones</p>
      </div>
      
      <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label small fw-bold">Nombre Completo</label>
          <input type="text" formControlName="nombre" class="form-control" placeholder="Ej: Juan Pérez">
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold">Teléfono</label>
          <input type="text" formControlName="telefono" class="form-control" placeholder="Ej: 3001234567">
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold">Correo Electrónico</label>
          <input type="email" formControlName="email" class="form-control" placeholder="juan@ejemplo.com">
        </div>

        <div class="mb-4">
          <label class="form-label small fw-bold">Contraseña</label>
          <input type="password" formControlName="password" class="form-control" placeholder="Mínimo 6 caracteres">
        </div>

        <button type="submit" [disabled]="registroForm.invalid" class="btn btn-primary w-100 fw-bold">
          Crear mi cuenta de Cliente
        </button>

        <div class="text-center mt-3">
          <a routerLink="/login" class="text-decoration-none small">¿Ya eres usuario? Inicia sesión</a>
        </div>
      </form>
    </div>
  </div>
</div>
