<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-light px-3 py-3">
  <div class="card shadow-lg border-0 w-100 login-card-compact" style="max-width: 380px;">
    <div class="card-body p-3 p-sm-4">
      <div class="text-center mb-3">
        <img src="images/Logo.jpeg" alt="FixLab" class="login-logo">
        <p class="text-muted small mb-0 mt-2">Gestión de Soporte y Ventas</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-2">
          <label class="form-label fw-semibold small">Correo Electrónico</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
            <input type="email" formControlName="email" class="form-control" 
                   [ngClass]="{'is-invalid': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}"
                   placeholder="correo@ejemplo.com">
          </div>
          <div class="invalid-feedback">Por favor ingrese un correo válido.</div>
        </div>

        <div class="mb-2">
          <label class="form-label fw-semibold small">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
            <input [type]="showPassword ? 'text' : 'password'" formControlName="password" class="form-control"
                   [ngClass]="{'is-invalid': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}"
                   placeholder="********">
            <button type="button" class="btn btn-outline-secondary input-group-text bg-white" (click)="showPassword = !showPassword"
                    [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Ver contraseña'" title="{{ showPassword ? 'Ocultar' : 'Ver contraseña' }}">
              <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
          <div class="invalid-feedback">La contraseña debe ser de al menos 6 caracteres.</div>
        </div>

        @if (recaptchaSiteKey) {
          <div class="mb-2 d-flex justify-content-center recaptcha-wrap">
            <div id="recaptcha-container"></div>
          </div>
        }

        <button type="submit" [disabled]="loginForm.invalid" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
          <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión
        </button>
      </form>

      <div class="text-center mt-3 d-flex flex-wrap justify-content-center gap-2 gap-sm-3 small">
        <a routerLink="/register" class="text-primary fw-semibold text-decoration-none">Regístrate aquí</a>
        <span class="text-muted">·</span>
        <a routerLink="/recuperar-password" class="text-secondary text-decoration-none">¿Olvidaste tu contraseña?</a>
      </div>
      
    </div>
  </div>
</div>
