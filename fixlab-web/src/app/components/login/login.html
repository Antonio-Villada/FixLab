<div class="container-fluid vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow-lg border-0" style="max-width: 400px; width: 100%;">
    <div class="card-body p-5">
      
      <div class="text-center mb-4">
        <i class="bi bi-tools text-primary" style="font-size: 3rem;"></i>
        <h2 class="fw-bold mt-2">FixLab</h2>
        <p class="text-muted">Gestión de Soporte y Ventas</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label fw-semibold">Correo Electrónico</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
            <input type="email" formControlName="email" class="form-control" 
                   [ngClass]="{'is-invalid': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}"
                   placeholder="correo@ejemplo.com">
          </div>
          <div class="invalid-feedback">Por favor ingrese un correo válido.</div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
            <input type="password" formControlName="password" class="form-control"
                   [ngClass]="{'is-invalid': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}"
                   placeholder="********">
          </div>
          <div class="invalid-feedback">La contraseña debe ser de al menos 6 caracteres.</div>
        </div>

        @if (recaptchaSiteKey) {
          <div class="mb-3 d-flex justify-content-center">
            <div id="recaptcha-container"></div>
          </div>
        }

        <button type="submit" [disabled]="loginForm.invalid" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
          <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión
        </button>
      </form>

      <div class="text-center mt-4">
        <span class="text-muted small">¿No tienes cuenta? </span>
        <a routerLink="/register" class="text-primary small fw-bold text-decoration-none">Regístrate aquí</a>
      </div>
      
    </div>
  </div>
</div>
