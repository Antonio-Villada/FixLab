# Ejemplo: Nginx sirviendo SOLO la carpeta browser (build estático, sin Node SSR).
# Copia el contenido de dist/fixlab-web/browser al root que sirve Nginx.
# Incluye este bloque dentro de server { ... }
#
#   location / {
#     try_files $uri $uri/ /index.html;
#   }
#
# Si en cambio usas el servidor SSR (npm run build + serve:ssr:fixlab-web),
# haz proxy_pass al proceso Node y NO uses try_files hacia index.html para HTML.
